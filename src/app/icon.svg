<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021526" />
      <stop offset="100%" stop-color="#082846" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d8d" />
      <stop offset="100%" stop-color="#eb3678" />
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#eb3678" stroke-width="2" stroke-opacity="0.45" />
  
  <!-- Incomplete Box (L-Shape: Left and Bottom edges) -->
  <path d="M 20 18 L 20 46 L 44 46" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing Dot at the Top-Right Corner of the Box -->
  <circle cx="44" cy="18" r="4.5" fill="url(#pinkGrad)" />
</svg>
