<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021526" />
      <stop offset="100%" stop-color="#06223d" />
    </linearGradient>
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e8f0" />
    </linearGradient>
    <linearGradient id="iGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d8d" />
      <stop offset="100%" stop-color="#eb3678" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad3)" stroke="#eb3678" stroke-width="2" stroke-opacity="0.4" />
  <!-- Stem & Base of L -->
  <path d="M 21 16 L 21 48 L 45 48" fill="none" stroke="url(#lGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Accent I (Stem of I parallel to L) -->
  <line x1="33" y1="22" x2="33" y2="38" stroke="url(#iGrad)" stroke-width="5" stroke-linecap="round" />
  <!-- Dot on I -->
  <circle cx="33" cy="16" r="3" fill="url(#iGrad)" />
</svg>
